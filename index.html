<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get the App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --fg: #f0ece3;
      --accent: #f5e642;
      --btn-h: 72px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Subtle grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    .wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(240,236,227,0.35);
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 18px;
      text-decoration: none;
      padding: 0 40px;
      height: var(--btn-h);
      background: var(--accent);
      color: #0a0a0a;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      outline: none;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.18s ease;
      box-shadow: 0 0 0 0 rgba(245,230,66,0);
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 1.5px solid var(--accent);
      transform: translate(6px, 6px);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .btn:hover {
      transform: translate(-3px, -3px);
      box-shadow: 0 0 40px 0 rgba(245,230,66,0.18);
    }

    .btn:hover::after {
      transform: translate(9px, 9px);
    }

    .btn:active {
      transform: translate(0px, 0px);
    }

    .btn:active::after {
      transform: translate(6px, 6px);
    }

    /* Arrow icon */
    .btn svg {
      flex-shrink: 0;
      transition: transform 0.18s ease;
    }

    .btn:hover svg {
      transform: translateX(4px);
    }

    .sub {
      font-size: 11px;
      letter-spacing: 0.1em;
      color: rgba(240,236,227,0.2);
    }
  </style>
</head>

</html>
